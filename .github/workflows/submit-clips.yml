name: Submit campaign clips

on:
  schedule:
    # A clip is only accepted for about 29 minutes after it goes public. GitHub only
    # actually starts a run here about once an hour however, so the tick is only there
    # to raise the odds that some run is alive before each slot - cr_submit.py waits
    # out the gap rather than relying on the next one.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cr-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    # The script waits up to 90 minutes for a slot to open (HORIZON_MINUTES), so the
    # job has to outlive that. Public repo, Linux runner: the minutes cost nothing.
    timeout-minutes: 110
    steps:
      # This repo carries 123 mp4s, so a full checkout costs four minutes and this
      # script reads four small files. Sparse checkout brings the run back to seconds.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            cr_submit.py
            cr_yt_queue.json
            cr_submitted.json
            state_highlight.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python cr_submit.py
        env:
          CR_COOKIE: ${{ secrets.CR_COOKIE }}
          # Repo variable, not a secret: flip CR_LIVE to "true" once the read-only
          # runs have proved the session survives a datacenter IP. Until then this
          # reports what it would submit and touches nothing.
          CR_LIVE: ${{ vars.CR_LIVE }}
          GITHUB_TOKEN: ${{ github.token }}
