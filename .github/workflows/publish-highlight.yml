name: Publish highlight reel

on:
  schedule:
    # Every 10 min; publish_highlight.py fires each reel at its planned moment
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dryrun:
        description: "Create container only, do not publish"
        type: boolean
        default: true
      date:
        description: "Force date (YYYY-MM-DD), empty = today"
        type: string
        default: ""
      repost:
        description: "Caption label to take down and publish again (e.g. MM 02); needs date"
        type: string
        default: ""

permissions:
  contents: write

# Only one publisher alive at a time. cancel-in-progress false means a cron tick
# that lands mid-run queues (GitHub keeps just the latest queued) instead of
# killing a reel mid-publish; the queued run starts the moment the active one
# finishes its budget, so coverage stays continuous.
concurrency:
  group: publish-highlight
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The script stays alive up to HORIZON_MINUTES (300) sleeping to each slot, so
    # the job must outlive that plus checkout and a publish poll. Public repo,
    # Linux runner: the minutes cost nothing; a slot that airs late can blow its
    # Content Rewards window.
    timeout-minutes: 350
    steps:
      # The clips are fetched by Instagram over raw.githubusercontent.com, so the
      # 3 GB of mp4s in this repo is only checkout latency (measured 4-6 min per
      # run). covers-highlight/ stays: os.path.exists() on it is what decides
      # whether a reel gets its committed cover.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            publish_highlight.py
            captions_highlight.json
            state_highlight.json
            covers-highlight/
      # A missing state_highlight.json is not a crash, it is a page that forgets
      # what it already posted and publishes duplicates. Refuse to run instead.
      - name: Check out every file publish_highlight.py needs
        run: |
          for f in publish_highlight.py captions_highlight.json state_highlight.json; do
            test -f "$f" || { echo "sparse checkout is missing $f"; exit 1; }
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python publish_highlight.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN_HIGHLIGHT }}
          IG_USER_ID: ${{ secrets.IG_USER_ID_HIGHLIGHT }}
          GITHUB_TOKEN: ${{ github.token }}
          DRYRUN: ${{ github.event.inputs.dryrun || 'false' }}
          FORCE_DATE: ${{ github.event.inputs.date || '' }}
          REPOST: ${{ github.event.inputs.repost || '' }}
